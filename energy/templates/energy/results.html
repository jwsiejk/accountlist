<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8"><title>Results — Energy Compare</title></head>
<body>
  <div id="app">Results</div>
  <script>
    async function loadDriveSizes() {
      const ctrl = 'E5760';
      const exp = 'DE460C 60-bay';
      const resp = await fetch("{{ url_for('energy.api_netapp_drive_sizes') }}?controller_model="+encodeURIComponent(ctrl)+"&expansion_model="+encodeURIComponent(exp));
      const data = await resp.json();
      console.log('sizes', data);
    }
  </script>
</body>
</html>
