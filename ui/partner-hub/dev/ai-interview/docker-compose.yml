version: "3.9"

services:
  ai-interview-stt:
    build:
      context: ./services/stt
    ports:
      - "9000:9000"
    environment:
      STT_MODEL: ${STT_MODEL:-base.en}
    volumes:
      - ai-interview-stt-cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  ai-interview-tts:
    build:
      context: ./services/tts
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

volumes:
  ai-interview-stt-cache:
