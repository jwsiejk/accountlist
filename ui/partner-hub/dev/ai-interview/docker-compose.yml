version: "3.9"

services:
  ai-interview-stt:
    build:
      context: ./services/stt
    ports:
      - "9000:9000"
    environment:
      STT_MODEL: ${STT_MODEL:-base.en}
    volumes:
      - ai-interview-stt-cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  ai-interview-tts:
    build:
      context: ./services/tts
    ports:
      - "8000:8000"
    environment:
      COQUI_MODEL_NAME: ${COQUI_MODEL_NAME:-tts_models/en/vctk/vits}
      COQUI_USE_CUDA: ${COQUI_USE_CUDA:-true}
      COQUI_SPEAKER: ${COQUI_SPEAKER:-}
      TTS_MP3_BITRATE: ${TTS_MP3_BITRATE:-192k}
      TTS_ATEMPO: ${TTS_ATEMPO:-0.94}
      TTS_VOICE_ATEMPO_JSON: ${TTS_VOICE_ATEMPO_JSON:-}
    gpus: all  # Requires NVIDIA Container Toolkit and WSL2 GPU support
    volumes:
      - ai-interview-tts-local-share:/root/.local/share/tts
      - ai-interview-tts-cache:/root/.cache/tts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

volumes:
  ai-interview-stt-cache:
  ai-interview-tts-local-share:
  ai-interview-tts-cache:
