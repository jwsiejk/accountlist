
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Energy Compare — FlashBlade//E vs NetApp E‑Series</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#0b0d10; --card:#11151a; --text:#e7edf3; --muted:#95a2b3; --line:#232a33;
      --accent:#27c2a8; --accent-2:#49a1ff; --chip:#15232b; --chip-b:#22313a;
      --input-bg:#0f141a; --input-b:#26313a; --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.25);
    }
    [data-theme="light"]{
      --bg:#f6f8fb; --card:#ffffff; --text:#0b1220; --muted:#616c7c; --line:#e6eaf0;
      --accent:#10b981; --accent-2:#2563eb; --chip:#f4f7f9; --chip-b:#e5e9f0;
      --input-bg:#ffffff; --input-b:#d9e1ea; --shadow:0 1px 2px rgba(0,0,0,.05);
    }
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .container{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
    .nav{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px}
    .brand .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2))}
    .nav .right{display:flex;align-items:center;gap:10px}
    .toggle{background:var(--chip);border:1px solid var(--chip-b);border-radius:999px;padding:6px 10px;cursor:pointer;color:var(--text)}
    h1{font-size:22px;margin:8px 0 16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    @media (max-width: 980px){.grid{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px}
    .card h2{margin:0 0 10px;font-size:18px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{font-weight:600;margin-bottom:6px;display:block}
    input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--input-b);background:var(--input-bg);color:var(--text);outline:none}
    input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%, transparent)}
    .help{color:var(--muted);font-size:.92em;margin-top:8px}
    .cta{margin-top:14px;display:flex;gap:8px;align-items:center}
    .btn{appearance:none;border:none;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;color:white;background:linear-gradient(135deg,var(--accent),var(--accent-2));}
    .pill{display:inline-flex;gap:6px;align-items:center;background:var(--chip);border:1px solid var(--chip-b);padding:6px 10px;border-radius:999px;color:var(--muted);font-weight:600}
  </style>
  <script>
    function applyTheme(t){
      document.documentElement.setAttribute('data-theme', t);
      try{ localStorage.setItem('theme', t); }catch(e){}
    }
    function toggleTheme(){
      const cur = document.documentElement.getAttribute('data-theme') || 'light';
      applyTheme(cur === 'light' ? 'dark' : 'light');
    }
    (function(){ try{ const t = localStorage.getItem('theme'); if(t){ applyTheme(t);} }catch(e){} })();
    async function onTrackChange(){
      const track = document.getElementById('dfm_track').value;
      try{
        const res = await fetch(`/api/valid_caps?dfm=${encodeURIComponent(track)}`);
        const data = await res.json();
        const sel = document.getElementById('capacity_pb');
        sel.innerHTML = '';
        if(data.ok){
          data.capacities.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v; opt.textContent = v;
            sel.appendChild(opt);
          });
        }
      }catch(e){ console.error(e); }
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand"><span class="dot"></span> Energy Compare</div>
      <div class="right">
        <span class="pill">v1 • CSV‑driven</span>
        <button class="toggle" type="button" onclick="toggleTheme()">Theme</button>
      </div>
    </div>

    <h1>FlashBlade//E vs NetApp E‑Series</h1>

    <form action="/results" method="POST" novalidate>
      <div class="grid">
        <div class="card">
          <h2>Configure FlashBlade//E</h2>
          <div class="row">
            <div>
              <label>DFM size (TB)</label>
              <select id="dfm_track" name="dfm_track" onchange="onTrackChange()">
                {% for t in tracks %}<option value="{{t}}">{{t}}</option>{% endfor %}
              </select>
            </div>
            <div>
              <label>Capacity (Usable PB)</label>
              <select id="capacity_pb" name="capacity_pb">
                {% for c in valid_caps %}<option value="{{c}}">{{c}}</option>{% endfor %}
              </select>
            </div>
          </div>

          <div class="row">
            <div><label>Utilization %</label><input type="number" step="1" name="pure_util" value="{{defaults.pure_util}}"></div>
            <div><label>PUE</label><input type="number" step="0.01" name="pure_pue" value="{{defaults.pure_pue}}"></div>
          </div>
          <div class="row">
            <div><label>$ / kWh</label><input type="number" step="0.001" name="pure_price" value="{{defaults.pure_price}}"></div>
            <div><label>DRR (Pure)</label><input type="number" step="0.1" name="pure_drr" value="{{defaults.pure_drr}}"></div>
          </div>
          <div class="help">Capacity points are constrained to valid track increments.</div>
        </div>

        <div class="card">
          <h2>NetApp Baseline</h2>
          <div class="row">
            <div><label>Utilization %</label><input type="number" step="1" name="na_util" value="{{defaults.na_util}}"></div>
            <div><label>PUE</label><input type="number" step="0.01" name="na_pue" value="{{defaults.na_pue}}"></div>
          </div>
          <div class="row">
            <div><label>$ / kWh</label><input type="number" step="0.001" name="na_price" value="{{defaults.na_price}}"></div>
            <div><label>Overhead (raw→usable)</label><input type="number" step="0.01" name="na_overhead" value="{{defaults.na_overhead}}"></div>
          </div>
          <div class="row">
            <div><label>DRR (NetApp)</label><input type="number" step="0.1" name="na_drr" value="{{defaults.na_drr}}"></div>
            <div><label>Drive Size (TB)</label><input type="number" step="1" name="na_drive_size" value="{{defaults.na_drive_size}}"></div>
          </div>
          <div class="row">
            <div><label>Auto-match tolerance (±%)</label><input type="number" step="0.1" name="tol_pct" value="10.0"></div><div></div>
          </div>
          <div class="help">Auto‑match lists only NetApp configs within the tolerance of FB Effective TB.</div>
        </div>
      </div>

      <div class="cta">
        <button class="btn" type="submit">See Results & Options</button>
        <span class="pill">Assumptions are summarized on the next page.</span>
      </div>
    </form>
  </div>
</body>
</html>
